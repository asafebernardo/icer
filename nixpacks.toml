# Fallback Nixpacks (EasyPanel “App”). Preferir Docker Compose / Dockerfile.
# Forçar provider Node — um site Vite sem isto sobe como Nginx estático e a API não corre.

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NIXPACKS_PATH = "/app/node_modules/.bin"

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build:app"]

[start]
cmd = "node server/index.js"
