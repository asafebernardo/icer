# ICER — produção via Docker (API Node + SPA em dist/).
# Não usar tipo Nginx/site estático no painel: o Node já serve o frontend.
#
# Local:
#   cp env.example .env
#   docker compose up -d --build
#
# EasyPanel / Coolify / Dokploy: criar serviço Docker Compose (não Nginx),
# porta 3001, e definir as variáveis de ambiente no painel (MongoDB, etc.).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_SERVER_AUTH: "true"
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      ICER_UPLOAD_DIR: /data/uploads
    env_file:
      - path: .env
        required: false
    volumes:
      - icer_uploads:/data/uploads
      - icer_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  icer_uploads:
  icer_logs:
